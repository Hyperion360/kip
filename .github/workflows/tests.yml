# The quality gate CONTRIBUTING.md names, run on every push to main and every
# PR: PHPStan level 6, the docs fidelity check, then the suite. PHP 8.3
# through 8.5, because the runtime contract claims >=8.3 and FrankenPHP ships
# 8.5. The 8.5 leg is deliberately NOT continue-on-error: a failure there
# counts like any other.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the checkout.
permissions:
  contents: read

# One run per ref; a newer push supersedes the queued one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    name: composer check (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer check
